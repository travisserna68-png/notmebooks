name: Publish scheduled blog posts

on:
  schedule:
    # 9:00 a.m. Mountain Daylight Time / 8:00 a.m. Mountain Standard Time.
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-scheduled-blog-posts
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build posts whose publish date has arrived
        run: npm run build

      - name: Publish any newly generated pages
        run: |
          if git diff --quiet -- blog; then
            echo "No posts are due today."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog
          git commit -m "Publish scheduled blog posts"
          git push
